  <style>

    /* Photography 作品列表 */

    .photo-projects {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px 24px;
    }

    .photo-project {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .photo-project__image {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #eeeeee;
    }

    .photo-project__image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .4s ease;
    }

    .photo-project:hover .photo-project__image img {
      transform: scale(1.025);
    }

    .photo-project__info {
      padding-top: 12px;
    }

    .photo-project__title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
    }

    .photo-project__meta {
      margin: 4px 0 0;
      font-size: 14px;
      color: #777;
    }

    @media (max-width: 900px) {

      .photo-projects {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 600px) {

      .photo-projects {
        grid-template-columns: 1fr;
        gap: 28px;
      }

    }

  </style>

</head>
